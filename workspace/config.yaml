# 自定义 OpenAI 兼容端点：Qwen/Qwen3-32B
# - key 从环境变量 OPENAI_API_KEY 读取（已写入 workspace\.env，不在此文件回显）
# - base_url 通过 OPENAI_BASE_URL 设定（已写入 workspace\.env）
model:
  provider: custom
  default: Qwen/Qwen3-32B
  base_url: https://api.openai.com/v1

platforms:
  api_server:
    port: 8642
    enabled: true
mcp_servers: {}